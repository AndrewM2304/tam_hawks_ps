<text x="150" y="197" fill="#e5edf2" font-size="14">A · High Street Steps</text>
<text x="338" y="577" fill="#e5edf2" font-size="14">B · Market Cross</text>
<text x="558" y="197" fill="#e5edf2" font-size="14">C · Depot and Roofs</text>
<text x="570" y="665" fill="#e5edf2" font-size="14">D · Foundry Bowls</text>
<circle cx="394" cy="549" r="7" fill="#fff"/><text x="351" y="537" class="s">SPAWN</text>
<text x="890" y="112" class="h">Four spaces, eight different line targets</text>
<text x="890" y="136" class="s muted">Two returnable lines per space.</text>
<text x="890" y="156" class="s muted">Three closed neighbourhood circuits.</text>
<text x="890" y="176" class="s muted">All whole-line / same-combo gates open.</text>
<text x="890" y="213" class="h">A · High Street Steps</text>
<text x="890" y="237" class="s muted">Local Y4–12; three stair terraces.</text>
<text x="890" y="257" class="s muted">Banked pavement, rails and wall returns.</text>
<text x="890" y="277" class="s muted">Hill is play, not a scenic access climb.</text>
<text x="890" y="314" class="h">B · Market Cross</text>
<text x="890" y="338" class="s muted">Street Y4; low pads and seating ledges.</text>
<text x="890" y="358" class="s muted">Clear spawn paving and different exits.</text>
<text x="890" y="378" class="s muted">Flat four-metre bypass repair pending.</text>
<text x="890" y="415" class="h">C · Depot and Roofs</text>
<text x="890" y="439" class="s muted">Dock Y6; roof Y10; roof channel 2 m.</text>
<text x="890" y="459" class="s muted">Bridge Y9; underside Y8.5; street Y4.</text>
<text x="890" y="479" class="s muted">Actual lower passage: 4.5 m clear.</text>
<text x="890" y="516" class="h">D · Foundry Bowls</text>
<text x="890" y="540" class="s muted">Rim Y4; entry street Y2.5.</text>
<text x="890" y="560" class="s muted">Individual bowls + hip, two street banks.</text>
<text x="890" y="580" class="s muted">Complete old skatepark is not reused.</text>
<text x="890" y="617" class="h">Native evidence, limited scope</text>
<text x="890" y="641" class="s muted">26/1 first run exposed a real bank drop.</text>
<text x="890" y="661" class="s muted">27/0 extended smoke does not clear it.</text>
<text x="890" y="681" class="s muted">Repaired source awaits no-jump proof.</text>
<text x="890" y="718" class="h">Glasgow comes first</text>
<text x="890" y="742" class="s muted">Sandstone tenements and tiled closes.</text>
<text x="890" y="762" class="s muted">Brick depot arches; Barras-inspired bays.</text>
<text x="890" y="782" class="s muted">Original signs; no franchise layout/assets.</text>
<path d="M50 813h80" stroke="#fff" stroke-width="3"/><text x="50" y="835" class="s">20 m</text>
<text x="50" y="790" class="s">Dark: solid street architecture · green: reserved play · gold: upper structures · blue/teal: transition court</text>
<text x="50" y="865" class="m">Coloured lines are design flows, not executed runs. The roof return and west uphill intermediate contacts remain unproved.</text>
<text x="50" y="893" class="s muted">Map coordinates are our construction proposal. Sketch perspective is not a measurement. Actual current Main remains City Tour while integration is private.</text>
